name: Test and package Skill
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install processing dependencies
        run: python -m pip install -r requirements.txt
      - name: Test and package
        shell: bash
        run: |
          set -o pipefail
          mkdir -p dist
          python -m unittest discover -s tests -v 2>&1 | tee dist/test-results.txt
          python scripts/build_skill.py --out dist | tee dist/build-info.json
          git archive --format=zip --prefix=kelip-paper-reading-web-source/ HEAD > dist/kelip-paper-reading-web-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: kelip-paper-reading-web
          path: dist/*
          if-no-files-found: error
          retention-days: 30
